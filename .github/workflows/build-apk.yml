name: Build Qatfah Test APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: node scripts/prepare.mjs ${{ matrix.app }}
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk qatfah-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qatfah-${{ matrix.app }}
          path: qatfah-${{ matrix.app }}.apk
  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "test-${{ github.run_number }}" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "قطفة نسخة اختبار ${{ github.run_number }}" --notes "نسخة أولية Debug للاختبار فقط وليست إصدارًا إنتاجيًا."
        env:
          GH_TOKEN: ${{ github.token }}
