name: Qatfah Android APK Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Check project source
        run: |
          node --check scripts/prepare.mjs
          node --check apps/client/app.js
          node --check apps/client/sw.js
          node scripts/prepare.mjs ${{ matrix.app }}
          test -s www/index.html
          test -s capacitor.config.json
          echo "WEB DIR:" && ls -la www/
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
      - name: Build installable test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify and name APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk qatfah-${{ matrix.app }}.apk
          sha256sum qatfah-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: qatfah-${{ matrix.app }}
          path: qatfah-${{ matrix.app }}.apk
          if-no-files-found: error
      - name: Collect build diagnosis
        if: failure()
        run: |
          echo "Node version:" && node --version
          echo "Java version:" && java -version
          echo "npm tree:" && npm ls @capacitor/cli @capacitor/core @capacitor/android || true
          echo "Config:" && cat capacitor.config.json || true
          echo "Generated files:" && ls -la android/app/build/outputs/apk/debug || true
  release:
    needs: android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Verify both APKs
        run: |
          test -s dist/qatfah-admin.apk
          test -s dist/qatfah-client.apk
          ls -lh dist/*.apk
      - name: Publish APKs in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "qatfah-test-${{ github.run_number }}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Qatfah Test APKs - Build ${{ github.run_number }}" \
            --notes "Android DEBUG APKs for testing only; not production-ready."
