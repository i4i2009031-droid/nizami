name: Qatfah Android APKs and Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - users.json
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verification:
    name: Five complete accounting UI cycles and PDF inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked verification dependencies
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install -r requirements-verification.txt
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core
      - name: Verify five accounting cycles before building or publishing
        run: python3 run_5x_system_verification.py --output verification-output
      - name: Preserve actual test reports and PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qatfah-five-cycle-verification
          path: verification-output
          if-no-files-found: error
  android:
    name: Android ${{ matrix.app }} APK
    runs-on: ubuntu-24.04
    needs: [verification]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore official Qatfah PNG branding
        run: node scripts/restore-assets.mjs
      - name: Verify native and application syntax
        run: |
          node --check apps/client/js/app.js
          node --check apps/client/js/ledger.js
          node --check apps/client/js/pdf.js
          node --check native/android/whatsapp-direct.js
          node --check server/index.mjs
      - name: Prepare web assets
        env:
          QATFAH_API_BASE: ${{ vars.QATFAH_API_BASE }}
        run: |
          node scripts/build-web.mjs ${{ matrix.app }}
          test -s dist/${{ matrix.app }}/index.html
      - name: Prepare native Android
        run: |
          node scripts/prep-capacitor.mjs ${{ matrix.app }}
          npx cap add android
          npx cap sync android
      - name: Install native Android document picker and persistent WhatsApp engine
        run: node scripts/inject-android.mjs ${{ matrix.app }}
      - name: Install native launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/android_assets.py ${{ matrix.app }}
      - name: Select signing mode and set APK versions
        id: configure
        env:
          QATFAH_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.QATFAH_KEYSTORE_BASE64 || '' }}
          QATFAH_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.QATFAH_KEYSTORE_PASSWORD || '' }}
          QATFAH_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.QATFAH_KEY_ALIAS || '' }}
          QATFAH_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.QATFAH_KEY_PASSWORD || '' }}
        run: node scripts/configure-android-build.mjs ${{ matrix.app }}
      - name: Build debug test APK
        if: steps.configure.outputs.mode == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Build owner-signed release APK
        if: steps.configure.outputs.mode == 'release' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          QATFAH_KEYSTORE_FILE: ${{ steps.configure.outputs.keystore_file }}
          QATFAH_KEYSTORE_PASSWORD: ${{ secrets.QATFAH_KEYSTORE_PASSWORD }}
          QATFAH_KEY_ALIAS: ${{ secrets.QATFAH_KEY_ALIAS }}
          QATFAH_KEY_PASSWORD: ${{ secrets.QATFAH_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify WhatsApp document provider in the built client APK
        if: matrix.app == 'client'
        env:
          QATFAH_BUILD_MODE: ${{ steps.configure.outputs.mode }}
        run: |
          qatfah_apk_path="android/app/build/outputs/apk/${QATFAH_BUILD_MODE}/app-${QATFAH_BUILD_MODE}.apk"
          test -s "$qatfah_apk_path"
          qatfah_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$qatfah_sdk_root"
          qatfah_apkanalyzer="$(command -v apkanalyzer || true)"
          if [ -z "$qatfah_apkanalyzer" ]; then
            qatfah_apkanalyzer="$qatfah_sdk_root/cmdline-tools/latest/bin/apkanalyzer"
          fi
          test -x "$qatfah_apkanalyzer"
          mkdir -p android/app/build/qatfah-checks
          "$qatfah_apkanalyzer" manifest print "$qatfah_apk_path" > android/app/build/qatfah-checks/AndroidManifest.xml
          "$qatfah_apkanalyzer" resources xml --file /res/xml/qatfah_wa_paths.xml "$qatfah_apk_path" > android/app/build/qatfah-checks/qatfah_wa_paths.xml
          qatfah_aapt2="$(printf '%s\n' "$qatfah_sdk_root"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          test -x "$qatfah_aapt2"
          "$qatfah_aapt2" dump resources "$qatfah_apk_path" > android/app/build/qatfah-checks/resources.txt
          node scripts/verify-android-provider.mjs \
            android/app/build/qatfah-checks/AndroidManifest.xml \
            android/app/build/qatfah-checks/qatfah_wa_paths.xml \
            com.qatfah.accounting \
            android/app/build/qatfah-checks/resources.txt
          printf 'WhatsApp PDF provider: verified in final APK manifest and resources\n' >> Qatfah-build-info-client.txt
      - name: Verify signature, name APK and record SHA256
        env:
          QATFAH_BUILD_MODE: ${{ steps.configure.outputs.mode }}
          QATFAH_APP: ${{ matrix.app }}
        run: |
          qatfah_apk_path="android/app/build/outputs/apk/${QATFAH_BUILD_MODE}/app-${QATFAH_BUILD_MODE}.apk"
          test -s "$qatfah_apk_path"
          cp "$qatfah_apk_path" "qatfah-${QATFAH_APP}.apk"
          qatfah_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$qatfah_sdk_root"
          qatfah_apksigner="$(printf '%s\n' "$qatfah_sdk_root"/build-tools/*/apksigner | sort -V | tail -n 1)"
          test -x "$qatfah_apksigner"
          "$qatfah_apksigner" verify --verbose --print-certs "qatfah-${QATFAH_APP}.apk"
          printf 'Signature verification: passed (Android SDK apksigner)\n' >> "Qatfah-build-info-${QATFAH_APP}.txt"
          qatfah_digest="$(sha256sum "qatfah-${QATFAH_APP}.apk")"
          printf 'APK SHA256: %s\n' "$qatfah_digest" | tee -a "Qatfah-build-info-${QATFAH_APP}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: qatfah-${{ matrix.app }}
          path: |
            qatfah-${{ matrix.app }}.apk
            Qatfah-build-info-${{ matrix.app }}.txt
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        env:
          QATFAH_KEYSTORE_FILE: ${{ steps.configure.outputs.keystore_file }}
        run: |
          if [ -n "$QATFAH_KEYSTORE_FILE" ]; then
            rm -f -- "$QATFAH_KEYSTORE_FILE"
            rmdir -- "$(dirname "$QATFAH_KEYSTORE_FILE")"
          fi
      - name: Build diagnostics
        if: failure()
        run: |
          node --version
          java -version
          ls -lah android/app/build/outputs/apk || true
  release:
    needs: [android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true
      - name: Confirm both APKs and the passing verification evidence exist
        run: |
          test -s release-files/qatfah-client.apk
          test -s release-files/qatfah-admin.apk
          test -s release-files/Qatfah-build-info-client.txt
          test -s release-files/Qatfah-build-info-admin.txt
          test -s release-files/verification-report.md
          test -s release-files/source-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('release-files/verification-report.json').read_text())
          assert report['requiredAutomationPassed'] is True
          assert report['sourceUnchangedDuringRun'] is True
          assert len(report['pdfChecks']) == 45
          assert all(item['status'] == 'PASS' for item in report['pdfChecks'])
          PY
      - name: Publish APKs with their actual signing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qatfah_client_mode="$(sed -n 's/^Build mode: //p' release-files/Qatfah-build-info-client.txt)"
          qatfah_admin_mode="$(sed -n 's/^Build mode: //p' release-files/Qatfah-build-info-admin.txt)"
          test "$qatfah_client_mode" = "$qatfah_admin_mode"
          if [ "$qatfah_client_mode" = 'release' ]; then
            qatfah_tag="qatfah-release-${{ github.run_number }}"
            qatfah_title="Qatfah signed release APKs ${{ github.run_number }}"
            printf '%s\n\n' 'RELEASE APKs signed with the configured owner key. Signing and APK integrity are verified; device and deployment acceptance remain required.' > release-notes.txt
          elif [ "$qatfah_client_mode" = 'debug' ]; then
            qatfah_tag="qatfah-test-${{ github.run_number }}"
            qatfah_title="Qatfah DEBUG test APKs ${{ github.run_number }}"
            printf '%s\n\n' 'DEBUG TEST APKs. An owner release signing key was not used. These files are for evaluation and must not be represented as production-signed APKs.' > release-notes.txt
          else
            printf '%s\n' 'Unknown signing mode; refusing to publish.' >&2
            exit 1
          fi
          printf '%s\n\n' 'Five real Chromium accounting UI cycles and 45 generated PDFs passed. The attached reports preserve the test scope: WhatsApp transport is simulated at the Android boundary, and live recipient delivery remains unverified.' >> release-notes.txt
          cat release-files/Qatfah-build-info-client.txt release-files/Qatfah-build-info-admin.txt >> release-notes.txt
          gh release create "$qatfah_tag" release-files/*.apk release-files/Qatfah-build-info-*.txt \
            release-files/verification-report.json release-files/verification-report.md release-files/source-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$qatfah_title" \
            --notes-file release-notes.txt
  web:
    needs: [verification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Restore official Qatfah PNG branding
        run: node scripts/restore-assets.mjs
      - name: Prepare static websites
        env:
          QATFAH_API_BASE: ${{ vars.QATFAH_API_BASE }}
        run: |
          node scripts/build-web.mjs
          mkdir -p site/admin
          cp -a dist/client/. site/
          cp -a dist/admin/. site/admin/
          touch site/.nojekyll
      - uses: actions/upload-artifact@v7
        with:
          name: qatfah-web
          path: site
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: qatfah.qodynex.tech
          keep_files: true # Preserve /mahwor static web on subsequent Qatfah deployments
