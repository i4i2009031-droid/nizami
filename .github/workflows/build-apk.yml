name: Qatfah Android APKs and Web (testing)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    name: Android ${{ matrix.app }} debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Restore official Qatfah PNG branding
        run: node scripts/restore-assets.mjs
      - name: Verify accounting and server modules
        run: |
          node --check apps/client/js/app.js
          node --check apps/client/js/ledger.js
          node --check apps/client/js/pdf.js
          node --check server/index.mjs
          npm test
      - name: Prepare web assets
        env:
          QATFAH_API_BASE: ${{ vars.QATFAH_API_BASE }}
        run: |
          node scripts/build-web.mjs ${{ matrix.app }}
          test -s dist/${{ matrix.app }}/index.html
      - name: Prepare native Android
        run: |
          node scripts/prep-capacitor.mjs ${{ matrix.app }}
          npx cap add android
          npx cap sync android
      - name: Install native launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/android_assets.py ${{ matrix.app }}
      - name: Build test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify and name the output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk qatfah-${{ matrix.app }}.apk
          sha256sum qatfah-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: qatfah-${{ matrix.app }}
          path: qatfah-${{ matrix.app }}.apk
          if-no-files-found: error
      - name: Build diagnostics
        if: failure()
        run: |
          node --version
          java -version
          ls -lah android/app/build/outputs/apk/debug || true
  release:
    needs: [android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true
      - name: Confirm both APKs exist
        run: |
          test -s release-files/qatfah-client.apk
          test -s release-files/qatfah-admin.apk
          ls -lh release-files/*.apk
      - name: Upload test APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "qatfah-test-${{ github.run_number }}" release-files/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Qatfah test APKs ${{ github.run_number }}" \
            --notes "DEBUG APKs for internal evaluation, not production-signed or certified. Live Google OAuth and WhatsApp pairing require configured external services."
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore official Qatfah PNG branding
        run: node scripts/restore-assets.mjs
      - name: Prepare static websites
        env:
          QATFAH_API_BASE: ${{ vars.QATFAH_API_BASE }}
        run: |
          node scripts/build-web.mjs
          mkdir -p site/admin
          cp -a dist/client/. site/
          cp -a dist/admin/. site/admin/
          touch site/.nojekyll
      - uses: actions/upload-artifact@v7
        with:
          name: qatfah-web
          path: site
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
