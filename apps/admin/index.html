<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قطفة | إدارة الاشتراكات</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="brand">🌿 قطفة للإدارة</div><span class="pill" id="clock">--:--</span></header><div class="welcome"><h1>إدارة المشتركين</h1><p>واجهة توضيحية، إدارة المستخدمين الحقيقية تتطلب API خاصًا</p></div><section class="panel"><h2>اتصال الخادم</h2><p class="muted">لا يتم تخزين كلمات المرور أو بيانات العملاء في مستودع GitHub العام. يلزم إعداد خادم إدارة خاص قبل إنشاء الحسابات.</p><label>رابط API<input id="api" placeholder="https://your-domain.com/api/v1"></label><button class="primary" id="ping">فحص الاتصال</button><p id="answer"></p></section><section class="panel"><h2>بيانات النظام</h2><div class="metric-grid"><div class="metric">حالة الاتصال<b>بانتظار الربط</b></div><div class="metric">المشتركون<b>—</b></div><div class="metric">النسخة<b>تجريبية</b></div></div></section></main><script>const el=document.getElementById('clock');function update(){el.textContent=new Date().toLocaleTimeString('ar-YE',{hour:'2-digit',minute:'2-digit'})}update();setInterval(update,30000);document.getElementById('ping').onclick=async()=>{const base=document.getElementById('api').value.trim();if(!/^https:\/\//.test(base)){document.getElementById('answer').textContent='أدخل رابط HTTPS صحيح';return}try{const res=await fetch(base.replace(/\/$/,'')+'/health');document.getElementById('answer').textContent='استجابة الخادم: '+res.status}catch{document.getElementById('answer').textContent='تعذر الوصول إلى الخادم'}};</script></body></html>
